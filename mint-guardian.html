<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mint — Guardian of Elysium</title>
  <style>
    :root {
      --bg: #071018;
      --card: #0d1a24;
      --line: #1e3a4a;
      --cyan: #3ec6ff;
      --gold: #d4b15a;
      --text: #e8f4ff;
      --muted: #8aa3b5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #123044 0%, var(--bg) 55%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
    }
    .art {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      object-position: center top;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      display: block;
      background: #061018;
    }
    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
    .price { color: var(--cyan); font-weight: 700; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    #connect { background: #163246; color: var(--text); }
    #mint { background: var(--cyan); color: #04202c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      word-break: break-all;
    }
    a { color: var(--gold); }
  </style>
</head>
<body>
  <div class="card">
    <img class="art" src="guardian-of-elysium.jpg" alt="Guardian of Elysium" />
    <h1>Guardian of Elysium</h1>
    <p>Open edition · <span class="price">0.1 HYPE</span> · Elysium Testnet</p>
    <button id="connect">Conectar carteira</button>
    <button id="mint" disabled>Mint</button>
    <div id="status">Desconectado</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script>
    const CONTRACT = "0x9016f1688C286C677FADF12FCe2395605481CCD8";
    const PRICE = ethers.parseEther("0.1");
    const CHAIN_ID = 99801;
    const CHAIN_HEX = "0x185d9"; // 99801
    const ABI = [
      "function mint(uint256 amount) payable",
      "function balanceOf(address account, uint256 id) view returns (uint256)"
    ];

    const elysium = {
      chainId: CHAIN_HEX,
      chainName: "Elysium Testnet",
      nativeCurrency: { name: "HYPE", symbol: "HYPE", decimals: 18 },
      rpcUrls: ["https://testnet-rpc.elysium.kinetiq.xyz"],
      blockExplorerUrls: ["https://elysium.kinetiq.xyz/testnet-explorer"]
    };

    const $ = (id) => document.getElementById(id);
    let provider, signer;

    async function ensureChain() {
      const current = await window.ethereum.request({ method: "eth_chainId" });
      if (current.toLowerCase() === CHAIN_HEX) return;
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: CHAIN_HEX }]
        });
      } catch (err) {
        if (err.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [elysium]
          });
        } else {
          throw err;
        }
      }
    }

    $("connect").onclick = async () => {
      try {
        if (!window.ethereum) {
          $("status").textContent = "Instale MetaMask ou Rabby.";
          return;
        }
        await window.ethereum.request({ method: "eth_requestAccounts" });
        await ensureChain();
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        const addr = await signer.getAddress();
        $("status").textContent = "Conectado: " + addr.slice(0, 6) + "..." + addr.slice(-4);
        $("mint").disabled = false;
      } catch (e) {
        $("status").textContent = e.message || String(e);
      }
    };

    $("mint").onclick = async () => {
      try {
        $("mint").disabled = true;
        $("status").textContent = "Confirmando na carteira...";
        await ensureChain();
        const contract = new ethers.Contract(CONTRACT, ABI, signer);
        const tx = await contract.mint(1, { value: PRICE });
        $("status").textContent = "Enviado: " + tx.hash + " — aguardando...";
        await tx.wait();
        $("status").innerHTML =
          "Mint ok. " +
          '<a target="_blank" href="https://elysium.kinetiq.xyz/testnet-explorer/tx/' +
          tx.hash + '">Ver no explorer</a>';
      } catch (e) {
        $("status").textContent = e.shortMessage || e.message || String(e);
      } finally {
        $("mint").disabled = false;
      }
    };
  </script>
</body>
</html>
