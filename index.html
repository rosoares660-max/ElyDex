<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElyDex</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <style>
    :root { --green:#c8ff3d; --card:#17181c; --line:#2a2c31; --text:#f4f4f5; --muted:#8b8f98; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, sans-serif;
      color: var(--text);
      background:
        linear-gradient(#111214 1px, transparent 1px) 0 0 / 56px 56px,
        linear-gradient(90deg, #111214 1px, transparent 1px) 0 0 / 56px 56px,
        #0b0c0e;
      min-height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 22px;
    }
    .nav { display: flex; gap: 6px; background: #16171b; padding: 6px; border-radius: 999px; border: 1px solid var(--line); }
    .nav button {
      background: transparent; color: #c7c9ce; border: 0; padding: 8px 14px;
      border-radius: 999px; cursor: pointer; font-weight: 700;
    }
    .nav button.on { background: #2a2c31; color: #fff; }
    .right { display: flex; gap: 8px; align-items: center; }
    .connect-sm {
      background: #fff; color: #111; border: 0; border-radius: 999px;
      padding: 8px 14px; font-weight: 800; cursor: pointer;
    }
    main { display: flex; justify-content: center; padding: 40px 16px 80px; }
    .panel { width: 100%; max-width: 430px; }
    .swap-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 12px;
    }
    .leg {
      background: #101114;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      margin: 8px 0;
    }
    .leg-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
    .leg-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 10px; }
    .token {
      display: flex; align-items: center; gap: 8px;
      background: #1d1f24; border: 1px solid #32343a;
      padding: 8px 10px; border-radius: 999px; font-weight: 800;
    }
    .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: #111; font-weight: 900; }
    .kit { background: #7aa2ff; }
    .spcx { background: var(--green); }
    .amt {
      width: 150px; background: transparent; border: 0; color: #fff;
      font-size: 28px; text-align: right; outline: none;
    }
    .flip-wrap { display: flex; justify-content: center; margin: -6px 0; position: relative; z-index: 2; }
    .flip {
      width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
      background: #1b1c20; color: #fff; cursor: pointer; font-size: 16px;
    }
    .go {
      width: 100%; margin-top: 10px; background: var(--green); color: #111;
      border: 0; border-radius: 16px; padding: 16px; font-size: 16px;
      font-weight: 900; letter-spacing: .04em; cursor: pointer;
    }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .stat { background: #101114; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
    .stat b { display: block; margin-bottom: 4px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .hidden { display: none; }
    .ok { color: #b9ff7a; margin-top: 12px; }
    .err { color: #ff8b8b; margin-top: 12px; white-space: pre-wrap; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
    input.plain, select.plain {
      width: 100%; padding: 11px; margin: 6px 0; border-radius: 12px;
      border: 1px solid var(--line); background: #0f1013; color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <button class="on" id="tabSwap">Swap</button>
      <button id="tabLiq">Liquidity</button>
      <button id="tabFaucet">Faucet</button>
    </div>
    <div class="right">
      <button class="connect-sm" id="btnConnect">Connect</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div id="viewSwap">
        <div class="swap-card">
          <div class="leg">
            <div class="leg-top"><span>Sell</span><span id="balSell">0</span></div>
            <div class="leg-row">
              <div class="token"><div class="dot kit">K</div> <span id="sellSym">KIT</span></div>
              <input class="amt" id="amountIn" placeholder="0" />
            </div>
          </div>
          <div class="flip-wrap"><button class="flip" id="btnFlip">↓</button></div>
          <div class="leg">
            <div class="leg-top"><span>Buy</span><span id="balBuy">0</span></div>
            <div class="leg-row">
              <div class="token"><div class="dot spcx">S</div> <span id="buySym">SPCX</span></div>
              <input class="amt" id="amountOut" placeholder="0" readonly />
            </div>
          </div>
          <button class="go" id="btnSwap">CONNECT WALLET</button>
        </div>
        <div class="stats">
          <div class="stat"><b>KIT</b><span id="poolKit">Pool —</span></div>
          <div class="stat"><b>SPCX</b><span id="poolSpcx">Pool —</span></div>
        </div>
      </div>

      <div id="viewLiq" class="swap-card hidden">
        <p class="sub">Coloca os dois tokens no pool.</p>
        <input class="plain" id="liqA" placeholder="KIT (ex: 100)" />
        <input class="plain" id="liqB" placeholder="SPCX (ex: 100)" />
        <button class="go" id="btnApprove">APROVAR TOKENS</button>
        <button class="go" id="btnLiq" style="margin-top:8px;background:#fff;">ADD LIQUIDITY</button>
      </div>

      <div id="viewFaucet" class="swap-card hidden">
        <p class="sub">10 KIT + 10 SPCX, 1x por hora. Precisas de HYPE para o gas.</p>
        <button class="go" id="btnFaucet">PEDIR TOKENS</button>
      </div>

      <div id="account" class="sub" style="margin-top:12px;"></div>
      <div id="log"></div>
      <button id="btnRefresh" class="hidden">Atualizar saldos</button>
      <button id="btnQuote" class="hidden">quote</button>
      <select id="tokenIn" class="hidden"><option value="A" selected>A</option><option value="B">B</option></select>
    </div>
  </main>

  <script>
    const CHAIN_ID = 99801;
    const RPC = "https://testnet-rpc.elysium.kinetiq.xyz";
    const KIT = "0xc8859BB6cfF436C5ae2B623364Ef1f024cc7FcB5";
    const SPCX = "0xbB23E11476c4E09E932EA0b826089427d7Bb4Ba8";
    const AMM = "0x67469B9aD6135473136014C42f79CB478D8aD2bc";
    const FAUCET = "0x5D05dEf10B7d5365CA8ede46Ff35E5a4046A9013";

    const tokenAbi = [
      "function approve(address spender, uint256 value) returns (bool)",
      "function balanceOf(address) view returns (uint256)"
    ];
    const ammAbi = [
      "function reserveA() view returns (uint256)",
      "function reserveB() view returns (uint256)",
      "function addLiquidity(uint256 amountA, uint256 amountB) returns (uint256)",
      "function getAmountOut(uint256 amountIn, uint256 reserveIn, uint256 reserveOut) view returns (uint256)",
      "function swap(address tokenIn, uint256 amountIn, uint256 minOut) returns (uint256)"
    ];
    const faucetAbi = ["function claim()"];

    let provider, signer, addr, kitToSpcx = true;

    function log(msg, ok) {
      document.getElementById("log").innerHTML =
        `<div class="${ok ? "ok" : "err"}">${msg}</div>`;
    }
    function show(id) {
      ["viewSwap","viewLiq","viewFaucet"].forEach((v) =>
        document.getElementById(v).classList.toggle("hidden", v !== id)
      );
      document.getElementById("tabSwap").classList.toggle("on", id === "viewSwap");
      document.getElementById("tabLiq").classList.toggle("on", id === "viewLiq");
      document.getElementById("tabFaucet").classList.toggle("on", id === "viewFaucet");
    }
    document.getElementById("tabSwap").onclick = () => show("viewSwap");
    document.getElementById("tabLiq").onclick = () => show("viewLiq");
    document.getElementById("tabFaucet").onclick = () => show("viewFaucet");

    function syncDir() {
      document.getElementById("tokenIn").value = kitToSpcx ? "A" : "B";
      document.getElementById("sellSym").innerText = kitToSpcx ? "KIT" : "SPCX";
      document.getElementById("buySym").innerText = kitToSpcx ? "SPCX" : "KIT";
    }
    document.getElementById("btnFlip").onclick = () => {
      kitToSpcx = !kitToSpcx;
      syncDir();
      document.getElementById("amountOut").value = "";
      quote().catch(() => {});
    };

    async function ensureChain() {
      const hex = "0x" + CHAIN_ID.toString(16);
      try {
        await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
      } catch (e) {
        if (e.code === 4902 || String(e.message).includes("Unrecognized")) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: hex,
              chainName: "Elysium Testnet",
              nativeCurrency: { name: "HYPE", symbol: "HYPE", decimals: 18 },
              rpcUrls: [RPC],
              blockExplorerUrls: ["https://elysium.kinetiq.xyz/testnet-explorer"]
            }]
          });
        } else { throw e; }
      }
    }

    async function connect() {
      if (!window.ethereum) throw new Error("Instale a MetaMask no Chrome");
      await ensureChain();
      provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      addr = await signer.getAddress();
      document.getElementById("account").innerText = addr;
      document.getElementById("btnConnect").innerText = addr.slice(0,6) + "..." + addr.slice(-4);
      document.getElementById("btnSwap").innerText = "SWAP";
      await refresh();
      log("Carteira conectada", true);
    }

    function contracts() {
      return {
        kit: new ethers.Contract(KIT, tokenAbi, signer),
        spcx: new ethers.Contract(SPCX, tokenAbi, signer),
        amm: new ethers.Contract(AMM, ammAbi, signer),
        faucet: new ethers.Contract(FAUCET, faucetAbi, signer)
      };
    }

    function short(n) {
      const x = Number(ethers.formatEther(n));
      return x.toLocaleString("pt-BR", { maximumFractionDigits: 4 });
    }

    async function refresh() {
      const { kit, spcx, amm } = contracts();
      const [a, b, ra, rb] = await Promise.all([
        kit.balanceOf(addr), spcx.balanceOf(addr), amm.reserveA(), amm.reserveB()
      ]);
      document.getElementById("balSell").innerText = kitToSpcx ? short(a) : short(b);
      document.getElementById("balBuy").innerText = kitToSpcx ? short(b) : short(a);
      document.getElementById("poolKit").innerText = "Pool " + short(ra);
      document.getElementById("poolSpcx").innerText = "Pool " + short(rb);
    }

    async function quote() {
      if (!signer || !document.getElementById("amountIn").value) return 0n;
      const { amm } = contracts();
      const amountIn = ethers.parseEther(document.getElementById("amountIn").value);
      const ra = await amm.reserveA();
      const rb = await amm.reserveB();
      const out = await amm.getAmountOut(amountIn, kitToSpcx ? ra : rb, kitToSpcx ? rb : ra);
      document.getElementById("amountOut").value = ethers.formatEther(out);
      return out;
    }

    document.getElementById("amountIn").addEventListener("input", () => quote().catch(() => {}));
    document.getElementById("btnConnect").onclick = async () => {
      try { await connect(); } catch (e) { const m = e.message || e; log(m, false); alert(m); }
    };
    document.getElementById("btnRefresh").onclick = () => refresh().catch((e) => log(e.message || e, false));
    document.getElementById("btnQuote").onclick = () => quote().catch((e) => log(e.message || e, false));
    document.getElementById("btnFaucet").onclick = async () => {
      try {
        const { faucet } = contracts();
        log("Pedindo tokens...", true);
        await (await faucet.claim()).wait();
        await refresh();
        log("Faucet ok: 10 KIT + 10 SPCX", true);
      } catch (e) { log(e.message || e, false); }
    };
    document.getElementById("btnApprove").onclick = async () => {
      try {
        const { kit, spcx } = contracts();
        log("Aprovando KIT...", true);
        await (await kit.approve(AMM, ethers.MaxUint256)).wait();
        log("Aprovando SPCX...", true);
        await (await spcx.approve(AMM, ethers.MaxUint256)).wait();
        log("Approve ok", true);
      } catch (e) { log(e.message || e, false); }
    };
    document.getElementById("btnLiq").onclick = async () => {
      try {
        const { amm } = contracts();
        const a = ethers.parseEther(document.getElementById("liqA").value);
        const b = ethers.parseEther(document.getElementById("liqB").value);
        log("Enviando liquidez...", true);
        await (await amm.addLiquidity(a, b)).wait();
        await refresh();
        log("Liquidez adicionada", true);
      } catch (e) { log(e.message || e, false); }
    };
    document.getElementById("btnSwap").onclick = async () => {
      try {
        if (!signer) { await connect(); return; }
        const { amm } = contracts();
        const amountIn = ethers.parseEther(document.getElementById("amountIn").value);
        const out = await quote();
        const minOut = out * 99n / 100n;
        const tokenIn = kitToSpcx ? KIT : SPCX;
        log("Enviando swap...", true);
        await (await amm.swap(tokenIn, amountIn, minOut)).wait();
        await refresh();
        log("Swap ok", true);
      } catch (e) { log(e.message || e, false); }
    };
  </script>
</body>
</html>
