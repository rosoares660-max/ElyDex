<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElyDex · KIT / SPCX</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #07080d;
      --card: #12141c;
      --line: #242833;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --blue: #4f8cff;
      --blue2: #7c5cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, sans-serif;
      background:
        radial-gradient(900px 400px at 10% -10%, #1a2a55 0%, transparent 50%),
        radial-gradient(700px 300px at 100% 0%, #2a1850 0%, transparent 45%),
        var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }
    .brand span { color: var(--blue); }
    .chip {
      font-size: 12px; color: #b9c4ff; background: #182038;
      border: 1px solid #2c3a66; padding: 6px 10px; border-radius: 999px;
    }
    .hero { margin-bottom: 18px; }
    .hero p { margin: 6px 0 0; color: var(--muted); }
    .grid { display: grid; gap: 14px; }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .wide { grid-column: 1 / -1; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }
    .card h3 { margin: 0 0 10px; font-size: 14px; color: #d5dbe6; }
    .addr { font-size: 12px; color: #8ea0c8; word-break: break-all; margin: 8px 0 0; }
    .balances { line-height: 1.55; color: #dce3ef; font-size: 14px; }
    input, select, button {
      width: 100%; padding: 11px 12px; margin: 6px 0;
      border: 0; border-radius: 12px; font-size: 14px;
    }
    input, select { background: #0c0e14; color: var(--text); border: 1px solid var(--line); }
    button { cursor: pointer; font-weight: 700; }
    .primary {
      background: linear-gradient(90deg, var(--blue), var(--blue2));
      color: white;
    }
    .ghost { background: #1b2030; color: #d5def0; }
    .ok { color: #5ee29a; margin-top: 10px; }
    .err { color: #ff8b8b; margin-top: 10px; white-space: pre-wrap; }
    #quote { color: #c9d4ff; min-height: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">Ely<span>Dex</span></div>
      <div class="chip">Elysium Testnet · 99801</div>
    </header>

    <div class="hero">
      <h2 style="margin:0;font-size:28px;letter-spacing:-0.04em;">KIT / SPCX</h2>
      <p>Mini DEX de teste. Sem valor real.</p>
    </div>

    <div class="grid">
      <div class="card wide">
        <button id="btnConnect" class="primary">Conectar carteira</button>
        <div id="account" class="addr"></div>
      </div>

      <div class="card">
        <h3>Saldos</h3>
        <div id="balances" class="balances">Conecte a carteira</div>
        <button id="btnRefresh" class="ghost">Atualizar saldos</button>
      </div>

      <div class="card">
        <h3>Faucet de teste</h3>
        <p style="margin:0 0 8px;color:#9aa3b2;font-size:13px;">10 KIT + 10 SPCX, 1x por hora. Precisa de HYPE para o gas.</p>
        <button id="btnFaucet" class="primary">Pedir tokens</button>
      </div>

      <div class="card">
        <h3>1. Aprovar tokens</h3>
        <button id="btnApprove" class="ghost">Aprovar KIT e SPCX para a AMM</button>
      </div>

      <div class="card">
        <h3>2. Adicionar liquidez</h3>
        <input id="liqA" placeholder="KIT (ex: 100)" />
        <input id="liqB" placeholder="SPCX (ex: 100)" />
        <button id="btnLiq" class="primary">Add liquidity</button>
      </div>

      <div class="card wide">
        <h3>3. Swap</h3>
        <select id="tokenIn">
          <option value="A">KIT → SPCX</option>
          <option value="B">SPCX → KIT</option>
        </select>
        <input id="amountIn" placeholder="Quantidade (ex: 10)" />
        <button id="btnQuote" class="ghost">Ver quanto sai</button>
        <button id="btnSwap" class="primary">Swap</button>
        <div id="quote"></div>
      </div>
    </div>
    <div id="log"></div>
  </div>

  <script>
    const CHAIN_ID = 99801;
    const RPC = "https://testnet-rpc.elysium.kinetiq.xyz";
    const KIT = "0xc8859BB6cfF436C5ae2B623364Ef1f024cc7FcB5";
    const SPCX = "0xbB23E11476c4E09E932EA0b826089427d7Bb4Ba8";
    const AMM = "0x67469B9aD6135473136014C42f79CB478D8aD2bc";
    const FAUCET = "0x5D05dEf10B7d5365CA8ede46Ff35E5a4046A9013";

    const tokenAbi = [
      "function approve(address spender, uint256 value) returns (bool)",
      "function balanceOf(address) view returns (uint256)"
    ];
    const ammAbi = [
      "function reserveA() view returns (uint256)",
      "function reserveB() view returns (uint256)",
      "function addLiquidity(uint256 amountA, uint256 amountB) returns (uint256)",
      "function getAmountOut(uint256 amountIn, uint256 reserveIn, uint256 reserveOut) view returns (uint256)",
      "function swap(address tokenIn, uint256 amountIn, uint256 minOut) returns (uint256)"
    ];
    const faucetAbi = ["function claim()"];

    let provider, signer, addr;

    function log(msg, ok) {
      document.getElementById("log").innerHTML =
        `<div class="${ok ? "ok" : "err"}">${msg}</div>`;
    }

    async function ensureChain() {
      const hex = "0x" + CHAIN_ID.toString(16);
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: hex }]
        });
      } catch (e) {
        if (e.code === 4902 || String(e.message).includes("Unrecognized")) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: hex,
              chainName: "Elysium Testnet",
              nativeCurrency: { name: "HYPE", symbol: "HYPE", decimals: 18 },
              rpcUrls: [RPC],
              blockExplorerUrls: ["https://elysium.kinetiq.xyz/testnet-explorer"]
            }]
          });
        } else {
          throw e;
        }
      }
    }

    async function connect() {
      if (!window.ethereum) throw new Error("Instale a MetaMask no Chrome");
      await ensureChain();
      provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      addr = await signer.getAddress();
      document.getElementById("account").innerText = addr;
      await refresh();
      log("Carteira conectada", true);
    }

    function contracts() {
      return {
        kit: new ethers.Contract(KIT, tokenAbi, signer),
        spcx: new ethers.Contract(SPCX, tokenAbi, signer),
        amm: new ethers.Contract(AMM, ammAbi, signer),
        faucet: new ethers.Contract(FAUCET, faucetAbi, signer)
      };
    }

    async function refresh() {
      const { kit, spcx, amm } = contracts();
      const [a, b, ra, rb] = await Promise.all([
        kit.balanceOf(addr),
        spcx.balanceOf(addr),
        amm.reserveA(),
        amm.reserveB()
      ]);
      document.getElementById("balances").innerHTML =
        `Seu KIT: ${ethers.formatEther(a)}<br>` +
        `Seu SPCX: ${ethers.formatEther(b)}<br>` +
        `Pool KIT: ${ethers.formatEther(ra)}<br>` +
        `Pool SPCX: ${ethers.formatEther(rb)}`;
    }

    document.getElementById("btnConnect").onclick = async () => {
      try { await connect(); }
      catch (e) {
        const msg = e && e.message ? e.message : String(e);
        log(msg, false);
        alert(msg);
      }
    };
    document.getElementById("btnRefresh").onclick = () =>
      refresh().catch((e) => log(e.message || e, false));
    document.getElementById("btnFaucet").onclick = async () => {
      try {
        const { faucet } = contracts();
        log("Pedindo tokens...", true);
        await (await faucet.claim()).wait();
        await refresh();
        log("Faucet ok: 10 KIT + 10 SPCX", true);
      } catch (e) { log(e.message || e, false); }
    };
    document.getElementById("btnApprove").onclick = async () => {
      try {
        const { kit, spcx } = contracts();
        log("Aprovando KIT...", true);
        await (await kit.approve(AMM, ethers.MaxUint256)).wait();
        log("Aprovando SPCX...", true);
        await (await spcx.approve(AMM, ethers.MaxUint256)).wait();
        log("Approve ok", true);
      } catch (e) { log(e.message || e, false); }
    };
    document.getElementById("btnLiq").onclick = async () => {
      try {
        const { amm } = contracts();
        const a = ethers.parseEther(document.getElementById("liqA").value);
        const b = ethers.parseEther(document.getElementById("liqB").value);
        log("Enviando liquidez...", true);
        await (await amm.addLiquidity(a, b)).wait();
        await refresh();
        log("Liquidez adicionada", true);
      } catch (e) { log(e.message || e, false); }
    };
    async function quote() {
      const { amm } = contracts();
      const amountIn = ethers.parseEther(document.getElementById("amountIn").value);
      const ra = await amm.reserveA();
      const rb = await amm.reserveB();
      const kitToSpcx = document.getElementById("tokenIn").value === "A";
      const out = await amm.getAmountOut(amountIn, kitToSpcx ? ra : rb, kitToSpcx ? rb : ra);
      document.getElementById("quote").innerText =
        "Sai cerca de " + ethers.formatEther(out) + (kitToSpcx ? " SPCX" : " KIT");
      return out;
    }
    document.getElementById("btnQuote").onclick = () =>
      quote().catch((e) => log(e.message || e, false));
    document.getElementById("btnSwap").onclick = async () => {
      try {
        const { amm } = contracts();
        const amountIn = ethers.parseEther(document.getElementById("amountIn").value);
        const out = await quote();
        const minOut = out * 99n / 100n;
        const tokenIn = document.getElementById("tokenIn").value === "A" ? KIT : SPCX;
        log("Enviando swap...", true);
        await (await amm.swap(tokenIn, amountIn, minOut)).wait();
        await refresh();
        log("Swap ok", true);
      } catch (e) { log(e.message || e, false); }
    };
  </script>
</body>
</html>
