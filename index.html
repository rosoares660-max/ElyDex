<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>KIT / SPCX Mini DEX</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; background: #0f1115; color: #eee; }
    p { color: #aaa; }
    input, button, select { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border-radius: 8px; border: 0; }
    button { cursor: pointer; background: #4f8cff; color: #fff; font-weight: 600; }
    .ok { color: #5ee29a; }
    .err { color: #ff7b7b; white-space: pre-wrap; }
    .box { background: #1a1d24; padding: 14px; margin: 12px 0; border-radius: 12px; }
  </style>
</head>
<body>
  <h2>Mini DEX</h2>
  <p>KIT / SPCX · Elysium Testnet (99801)</p>
  <button id="btnConnect">Conectar carteira</button>
  <div id="account"></div>
  <div id="log"></div>

  <div class="box">
    <b>Saldos</b>
    <div id="balances">Conecte a carteira</div>
    <button id="btnRefresh">Atualizar saldos</button>
  </div>

  <div class="box">
    <b>Faucet de teste</b>
    <p>10 KIT + 10 SPCX, 1x por hora. Precisa de HYPE para o gas.</p>
    <button id="btnFaucet">Pedir tokens</button>
  </div>

  <div class="box">
    <b>1. Aprovar tokens</b>
    <button id="btnApprove">Aprovar KIT e SPCX para a AMM</button>
  </div>

  <div class="box">
    <b>2. Adicionar liquidez</b>
    <input id="liqA" placeholder="KIT (ex: 100)" />
    <input id="liqB" placeholder="SPCX (ex: 100)" />
    <button id="btnLiq">Add liquidity</button>
  </div>

  <div class="box">
    <b>3. Swap</b>
    <select id="tokenIn">
      <option value="A">KIT → SPCX</option>
      <option value="B">SPCX → KIT</option>
    </select>
    <input id="amountIn" placeholder="Quantidade (ex: 10)" />
    <button id="btnQuote">Ver quanto sai</button>
    <button id="btnSwap">Swap</button>
    <div id="quote"></div>
  </div>

  <script>
    const CHAIN_ID = 99801;
    const RPC = "https://testnet-rpc.elysium.kinetiq.xyz";
    const KIT = "0xc8859BB6cfF436C5ae2B623364Ef1f024cc7FcB5";
    const SPCX = "0xbB23E11476c4E09E932EA0b826089427d7Bb4Ba8";
    const AMM = "0x67469B9aD6135473136014C42f79CB478D8aD2bc";
    const FAUCET = "0x5D05dEf10B7d5365CA8ede46Ff35E5a4046A9013";

    const tokenAbi = [
      "function approve(address spender, uint256 value) returns (bool)",
      "function balanceOf(address) view returns (uint256)",
      "function transfer(address to, uint256 value) returns (bool)"
    ];
    const ammAbi = [
      "function reserveA() view returns (uint256)",
      "function reserveB() view returns (uint256)",
      "function addLiquidity(uint256 amountA, uint256 amountB) returns (uint256)",
      "function getAmountOut(uint256 amountIn, uint256 reserveIn, uint256 reserveOut) view returns (uint256)",
      "function swap(address tokenIn, uint256 amountIn, uint256 minOut) returns (uint256)"
    ];
    const faucetAbi = ["function claim()"];

    let provider, signer, addr;

    function log(msg, ok) {
      document.getElementById("log").className = ok ? "ok" : "err";
      document.getElementById("log").innerText = String(msg);
    }

    function getEthereum() {
      if (window.ethereum) return window.ethereum;
      throw new Error("MetaMask nao encontrada neste Chrome.");
    }

    async function ensureChain(eth) {
      const hex = "0x" + CHAIN_ID.toString(16);
      try {
        await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
      } catch (e) {
        if (e.code === 4902 || String(e.message || "").toLowerCase().includes("unrecognized")) {
          await eth.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: hex,
              chainName: "Elysium Testnet",
              nativeCurrency: { name: "HYPE", symbol: "HYPE", decimals: 18 },
              rpcUrls: [RPC],
              blockExplorerUrls: ["https://elysium.kinetiq.xyz/testnet-explorer"]
            }]
          });
        } else if (e.code !== 4001) {
          throw e;
        }
      }
    }

    async function connect() {
      const eth = getEthereum();
      await ensureChain(eth);
      provider = new ethers.BrowserProvider(eth);
      await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      addr = await signer.getAddress();
      document.getElementById("account").innerText = addr;
      await refresh();
      log("Carteira conectada", true);
    }

    function contracts() {
      if (!signer) throw new Error("Conecta a carteira primeiro");
      return {
        kit: new ethers.Contract(KIT, tokenAbi, signer),
        spcx: new ethers.Contract(SPCX, tokenAbi, signer),
        amm: new ethers.Contract(AMM, ammAbi, signer),
        faucet: new ethers.Contract(FAUCET, faucetAbi, signer)
      };
    }

    async function refresh() {
      const { kit, spcx, amm } = contracts();
      const [a, b, ra, rb] = await Promise.all([
        kit.balanceOf(addr),
        spcx.balanceOf(addr),
        amm.reserveA(),
        amm
