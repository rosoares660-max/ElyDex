<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>KIT / SPCX Mini DEX</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; background: #0f1115; color: #eee; }
    h2 { margin-bottom: 4px; }
    p { color: #aaa; }
    input, button, select { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border-radius: 8px; border: 0; }
    button { cursor: pointer; background: #4f8cff; color: #fff; font-weight: 600; }
    button:hover { opacity: 0.9; }
    .ok { color: #5ee29a; }
    .err { color: #ff7b7b; white-space: pre-wrap; }
    .box { background: #1a1d24; padding: 14px; margin: 12px 0; border-radius: 12px; }
  </style>
</head>
<body>
  <h2>Mini DEX</h2>
  <p>KIT / SPCX · Elysium Testnet (99801)</p>
  <button id="btnConnect">Conectar carteira</button>
  <div id="account"></div>

  <div class="box">
    <b>Saldos</b>
    <div id="balances">Conecte a carteira</div>
    <button id="btnRefresh">Atualizar saldos</button>
  </div>

  <div class="box">
    <b>1. Aprovar tokens</b>
    <button id="btnApprove">Aprovar KIT e SPCX para a AMM</button>
  </div>

  <div class="box">
    <b>2. Adicionar liquidez</b>
    <input id="liqA" placeholder="KIT (ex: 100)" />
    <input id="liqB" placeholder="SPCX (ex: 100)" />
    <button id="btnLiq">Add liquidity</button>
  </div>

  <div class="box">
    <b>3. Swap</b>
    <select id="tokenIn">
      <option value="A">KIT → SPCX</option>
      <option value="B">SPCX → KIT</option>
    </select>
    <input id="amountIn" placeholder="Quantidade (ex: 10)" />
    <button id="btnQuote">Ver quanto sai</button>
    <button id="btnSwap">Swap</button>
    <div id="quote"></div>
  </div>

  <div id="log"></div>

  <script>
    const CHAIN_ID = 99801;
    const RPC = "https://testnet-rpc.elysium.kinetiq.xyz";

    const KIT = "0xc8859BB6cfF436C5ae2B623364Ef1f024cc7FcB5";
    const SPCX = "0xbB23E11476c4E09E932EA0b826089427d7Bb4Ba8";
    const AMM = "0x67469B9aD6135473136014C42f79CB478D8aD2bc";

    const tokenAbi = [
      "function approve(address spender, uint256 value) returns (bool)",
      "function balanceOf(address) view returns (uint256)"
    ];
    const ammAbi = [
      "function reserveA() view returns (uint256)",
      "function reserveB() view returns (uint256)",
      "function addLiquidity(uint256 amountA, uint256 amountB) returns (uint256)",
      "function getAmountOut(uint256 amountIn, uint256 reserveIn, uint256 reserveOut) view returns (uint256)",
      "function swap(address tokenIn, uint256 amountIn, uint256 minOut) returns (uint256)"
    ];

    let provider, signer, addr;

    function log(msg, ok) {
      document.getElementById("log").innerHTML =
        `<div class="${ok ? "ok" : "err"}">${msg}</div>`;
    }

    async function ensureChain() {
      const hex = "0x" + CHAIN_ID.toString(16);
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: hex }]
        });
      } catch (e) {
        if (e.code === 4902 || String(e.message).includes("Unrecognized")) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: hex,
              chainName: "Elysium Testnet",
              nativeCurrency: { name: "HYPE", symbol: "HYPE", decimals: 18 },
              rpcUrls: [RPC],
              blockExplorerUrls: ["https://elysium.kinetiq.xyz/testnet-explorer"]
            }]
          });
        } else {
          throw e;
        }
      }
    }

    async function connect() {
      if (!window.ethereum) throw new Error("Instale a MetaMask no Chrome");
      await ensureChain();
      provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      addr = await signer.getAddress();
      document.getElementById("account").innerText = addr;
      await refresh();
      log("Carteira conectada", true);
    }

    function contracts() {
      if (KIT.startsWith("COLE")) throw new Error("Cole os 3 endereços no arquivo HTML");
      return {
        kit: new ethers.Contract(KIT, tokenAbi, signer),
        spcx: new ethers.Contract(SPCX, tokenAbi, signer),
        amm: new ethers.Contract(AMM, ammAbi, signer)
      };
    }

    async function refresh() {
      const { kit, spcx, amm } = contracts();
      const [a, b, ra, rb] = await Promise.all([
        kit.balanceOf(addr),
        spcx.balanceOf(addr),
        amm.reserveA(),
        amm.reserveB()
      ]);
      document.getElementById("balances").innerHTML =
        `Seu KIT: ${ethers.formatEther(a)}<br>` +
        `Seu SPCX: ${ethers.formatEther(b)}<br>` +
        `Pool KIT: ${ethers.formatEther(ra)}<br>` +
        `Pool SPCX: ${ethers.formatEther(rb)}`;
    }

    document.getElementById("btnConnect").onclick = async () => {
      try { await connect(); }
      catch (e) {
        const msg = e && e.message ? e.message : String(e);
        log(msg, false);
        alert(msg);
      }
    };

    document.getElementById("btnRefresh").onclick = () =>
      refresh().catch((e) => log(e.message || e, false));

    document.getElementById("btnApprove").onclick = async () => {
      try {
        const { kit, spcx } = contracts();
        log("Aprovando KIT...", true);
        await (await kit.approve(AMM, ethers.MaxUint256)).wait();
        log("Aprovando SPCX...", true);
        await (await spcx.approve(AMM, ethers.MaxUint256)).wait();
        log("Approve ok", true);
      } catch (e) { log(e.message || e, false); }
    };

    document.getElementById("btnLiq").onclick = async () => {
      try {
        const { amm } = contracts();
        const a = ethers.parseEther(document.getElementById("liqA").value);
        const b = ethers.parseEther(document.getElementById("liqB").value);
        log("Enviando liquidez...", true);
        await (await amm.addLiquidity(a, b)).wait();
        await refresh();
        log("Liquidez adicionada", true);
      } catch (e) { log(e.message || e, false); }
    };

    async function quote() {
      const { amm } = contracts();
      const amountIn = ethers.parseEther(document.getElementById("amountIn").value);
      const ra = await amm.reserveA();
      const rb = await amm.reserveB();
      const kitToSpcx = document.getElementById("tokenIn").value === "A";
      const out = await amm.getAmountOut(
        amountIn,
        kitToSpcx ? ra : rb,
        kitToSpcx ? rb : ra
      );
      document.getElementById("quote").innerText =
        "Sai cerca de " + ethers.formatEther(out) + (kitToSpcx ? " SPCX" : " KIT");
      return out;
    }

    document.getElementById("btnQuote").onclick = () =>
      quote().catch((e) => log(e.message || e, false));

    document.getElementById("btnSwap").onclick = async () => {
      try {
        const { amm } = contracts();
        const amountIn = ethers.parseEther(document.getElementById("amountIn").value);
        const out = await quote();
        const minOut = out * 99n / 100n;
        const tokenIn = document.getElementById("tokenIn").value === "A" ? KIT : SPCX;
        log("Enviando swap...", true);
        await (await amm.swap(tokenIn, amountIn, minOut)).wait();
        await refresh();
        log("Swap ok", true);
      } catch (e) { log(e.message || e, false); }
    };
  </script>
</body>
</html>
